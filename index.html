<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест Астана</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d7dde7;
      --accent: #0f766e;
      --good: #067647;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 18px clamp(14px, 3vw, 34px);
    }
    .top {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: #fbfcfd;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 18px clamp(14px, 3vw, 34px) 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 16px;
    }
    .toolbar, .quiz, .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .toolbar {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 120px 120px;
      gap: 8px;
      margin-bottom: 12px;
    }
    input, button {
      font: inherit;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
    }
    input { padding: 0 10px; min-width: 0; }
    button { padding: 0 12px; font-weight: 700; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .quiz { padding: clamp(16px, 3vw, 26px); min-height: 480px; }
    .meta {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .question {
      white-space: pre-wrap;
      font-size: clamp(19px, 2.1vw, 27px);
      line-height: 1.34;
      margin: 0 0 18px;
    }
    .media {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }
    .media img {
      display: block;
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111827;
    }
    .answers { display: grid; gap: 10px; }
    .answer {
      min-height: 52px;
      padding: 11px 13px;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
      background: #fbfcfd;
    }
    .answer.correct { border-color: var(--good); background: #ecfdf3; color: var(--good); }
    .answer.wrong { border-color: var(--bad); background: #fef3f2; color: var(--bad); }
    .answer.selected { border-color: var(--accent); background: #e7f4f1; color: var(--accent); }
    .feedback { min-height: 28px; margin-top: 12px; font-weight: 700; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .side { padding: 14px; align-self: start; }
    .side h2 { margin: 0 0 10px; font-size: 18px; }
    .row { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 10px 0; }
    @media (max-width: 840px) {
      .top, main, .toolbar { grid-template-columns: 1fr; }
      .pills { justify-content: flex-start; }
    }

    /* astana-exam-mode-v1 */
    .exam-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .exam-start { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button:disabled, input:disabled, select:disabled { opacity: .48; cursor: not-allowed; }
    .exam-status { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; width: 100%; }
    .exam-timer {
      min-width: 104px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f6f8f9;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      text-align: center;
    }
    .exam-timer.warning { border-color: var(--bad); color: var(--bad); background: #fef3f2; }
    .exam-answered { color: var(--muted); font-weight: 700; }
    .exam-finish { margin-left: auto; border-color: var(--bad); color: var(--bad); font-weight: 700; }
    .exam-result {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--accent);
      border-left-width: 4px;
      border-radius: 8px;
      background: #f3faf8;
      line-height: 1.5;
    }
    .exam-result strong { display: block; margin-bottom: 4px; font-size: 18px; }
    .exam-result span { color: var(--muted); }
    @media (max-width: 640px) {
      .exam-panel, .exam-status { align-items: stretch; flex-direction: column; }
      .exam-panel button, .exam-finish { width: 100%; margin-left: 0; }
      .exam-timer { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Тест Астана</h1>
      <div class="pills">
        <span class="pill" id="total"></span>
        <span class="pill" id="score"></span>
      </div>
    </div>
  </header>
  <main>
    <section>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Поиск по вопросу или ответу">
        <button id="shuffle">Перемешать</button>
        <button id="reset">Сброс</button>
      </div>
      <!-- astana-exam-mode-v1 -->
      <div class="exam-panel" id="examPanel">
        <button class="exam-start" id="startExam" type="button">Экзамен: 100 вопросов · 2:30</button>
        <div class="exam-status" id="examStatus" hidden>
          <span class="exam-timer" id="examTimer">02:30:00</span>
          <span class="exam-answered" id="examAnswered">Отвечено 0 / 100</span>
          <button class="exam-finish" id="finishExam" type="button">Завершить экзамен</button>
        </div>
      </div>
      <div class="exam-result" id="examResult" hidden></div>
      <article class="quiz">
        <div class="meta"><span id="pos"></span><span>тест Астана.docx</span></div>
        <p class="question" id="question"></p>
        <div class="media" id="media"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button id="prev">Назад</button>
          <button class="primary" id="next">Дальше</button>
          <button id="show">Показать ответ</button>
        </div>
      </article>
    </section>
    <aside class="side">
      <h2>Прогресс</h2>
      <div class="row"><span>Верно</span><strong id="right">0</strong></div>
      <div class="row"><span>Ошибки</span><strong id="wrong">0</strong></div>
      <div class="row"><span>Показано</span><strong id="seen">0</strong></div>
      <div class="row"><span>Дубликаты убраны</span><strong>393</strong></div>
    </aside>
  </main>
  <script>
    const DATA = {"cards": [{"id": 1, "question": "Какую методику интервенционной радиологии необходимо применить при кровянистых выделениях из соска и отсутствии патологических изменений молочной железы на маммограмме?", "options": ["МР-маммографию", "КТ-маммографию", "дуктографию", "стереотаксис"], "correct_index": 2, "answer": "дуктографию", "source": "тест Астана.docx", "images": []}, {"id": 2, "question": "Для какого процесса НАИБОЛЕЕ характерна представленная сцинтиграмма скелета:", "options": ["Метастазы", "Норма", "Гонит", "Туберкулез", "Коксартроз"], "correct_index": 0, "answer": "Метастазы", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image1.webp"]}, {"id": 3, "question": "Для какого патологического процесса НАИБОЛЕЕ характерна представленная урограмма:", "options": ["Пионефроз", "Множественные парапельвикальные кисты", "Уретероцеле (голова кобры)", "Мочекаменная болезнь", "Врожденный гидронефроз 3 степени"], "correct_index": 0, "answer": "Пионефроз", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image2.webp"]}, {"id": 4, "question": "Для какой патологии легких НАИБОЛЕЕ характерна представленная КТ – картина на рисунке:", "options": ["Интерстициальная пневмония", "Бронхоэктазы", "Саркоидоз", "Идиопатический фиброзирующий альвеолит", "Буллезная эмфизема"], "correct_index": 4, "answer": "Буллезная эмфизема", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image3.webp"]}, {"id": 5, "question": "Больному с инородным телом пищевода сделана КТ органов грудной клетки. Для какой патологии пищевода НАИБОЛЕЕ характерна данная КТ-картина:", "options": ["Перфорация", "Стеноз", "Ахалазия", "Обтурация просвета", "Супрастенотическое расширение"], "correct_index": 0, "answer": "Перфорация", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image4.webp"]}, {"id": 6, "question": "Больному с положительным гемокульт-тестом проведена виртуальная КТ-колоноскопия. Для какой патологии толстой кишки НАИБОЛЕЕ характерна представленная КТ-картина на рисунке:", "options": ["Дивертикулез", "Рак", "Полип", "Болезнь Крона", "Неспецифический язвенный колит"], "correct_index": 1, "answer": "Рак", "source": "тест Астана.docx", "images": []}, {"id": 7, "question": "Для какой патологии НАИБОЛЕЕ характерна представленная МРТ-картина тазобедренных суставов:", "options": ["Вывих головки бедренной кости", "Туберкулезный коксит", "Метастаз головки бедренной кости", "Остеоартроз", "Болезнь Пертеса"], "correct_index": 4, "answer": "Болезнь Пертеса", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image5.webp"]}, {"id": 8, "question": "Для какой патологии почек НАИБОЛЕЕ характерна представленная МРТ-картина:", "options": ["Ангиомиолипомы", "Онкоцитомы", "Гемангиомы", "Метастазы", "Простые кисты"], "correct_index": 4, "answer": "Простые кисты", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image6.webp"]}, {"id": 9, "question": "Для какой патологии матки НАИБОЛЕЕ характерна представленная МРТ-картина на рисунке:", "options": ["Миома", "Рак эндометрия", "Эндоматриоз", "Рак шейки", "Аномалия развития"], "correct_index": 3, "answer": "Рак шейки", "source": "тест Астана.docx", "images": []}, {"id": 10, "question": "В какой проекции необходимо провести рентгенологическое исследование черепа пациенту с подозрением на невриному правого зрительного нерва:", "options": ["по Резе", "по Стенверсу", "по Шуллеру", "по Майеру", "по Шуллеру-Майеру"], "correct_index": 0, "answer": "по Резе", "source": "тест Астана.docx", "images": []}, {"id": 11, "question": "Какой метод рентгенологического исследования НАИБОЛЕЕ оптимален для определения состояния плевральной полости: Рентгеноскопия Рентгенография Томография", "options": ["Латерография", "Флюорография"], "correct_index": 0, "answer": "Латерография", "source": "тест Астана.docx", "images": []}, {"id": 12, "question": "Для оценки каких анатомических структур НАИБОЛЕЕ часто проводится представленный рентгенологический метод исследования:", "options": ["Трахеобронхиальное дерево", "Легочный рисунок", "Сердечно-сосудистая система", "Позвоночный столб", "Диафрагма"], "correct_index": 0, "answer": "Трахеобронхиальное дерево", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image7.webp"]}, {"id": 13, "question": "Для какого заболевания характернарентгенологическая картина, представленная на рентгенограмме органов грудной клетки Осумкованныйплеврит Пневмосклероз", "options": ["Среднедолевая пневмония", "Очаговая пневмония", "Ателектаз средней доли"], "correct_index": 0, "answer": "Среднедолевая пневмония", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image8.webp", "astana_test_assets_web/image9.webp"]}, {"id": 14, "question": "Для какой патологии органов грудной клетки НАИБОЛЕЕ характерны изменения на представленных рентгенограммах органов грудной клетки в 2-х проекциях: Центральный рак", "options": ["Тимома", "Осумкованный медиастинальный плеврит", "Невринома", "Пневмокониоз"], "correct_index": 0, "answer": "Тимома", "source": "тест Астана.docx", "images": ["astana_test_assets_web/image10.webp"]}, {"id": 15, "question": "На рентгенограммах органов грудной клетки определяется картина - образования в нижней доле левого легкого овальной формы, с четкими контурами, неоднородной структуры за счет участков обызвествления по контуру образования по типу капсулы, прилежащий контур тени к костальной плевре слегка сплюснут, на фоне образования просматриваются тени легочного рисунка. Для какой патологии легких НАИБОЛЕЕ характерна описанная рентгенологическая картина: Аспергиллез", "options": ["Эхинококк", "Микоплазма", "Туберкулез", "Кокцидиодомикоз"], "correct_index": 0, "answer": "Эхинококк", "source": "тест Астана.docx", "images": []}, {"id": 16, "question": "Для какой патологии легких НАИБОЛЕЕ характерны изменения на представленной обзорной рентгенограмме органов грудной клетки: Ателектаз Пневмокониоз", "options": ["Отек легких", "Центральный рак правого легкого     const cards = DATA.cards;

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    function rebuild() {
      const term = $("search").value.trim().toLowerCase();
      order = cards.map((c, i) => [c, i])
        .filter(([c]) => !term || c.question.toLowerCase().includes(term) || c.answer.toLowerCase().includes(term))
        .map(([, i]) => i);
      index = Math.min(index, Math.max(0, order.length - 1));
      render();
    }
    function renderStats() {
      let right = 0, wrong = 0, seen = 0;
      for (const card of cards) {
        const p = progress[card.id];
        if (!p) continue;
        if (p.seen) seen++;
        right += p.right || 0;
        wrong += p.wrong || 0;
      }
      $("total").textContent = `${DATA.stats.total} вопросов`;
      $("score").textContent = `Верно ${right} / Ошибки ${wrong}`;
      $("right").textContent = right;
      $("wrong").textContent = wrong;
      $("seen").textContent = seen;
    }
    function render() {
      renderStats();
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("answers").innerHTML = "";
      $("media").innerHTML = "";
      if (!order.length) {
        $("pos").textContent = "0 / 0";
        $("question").textContent = "Нет вопросов для выбранного фильтра";
        return;
      }
      const card = cards[order[index]];
      $("pos").textContent = `${index + 1} / ${order.length}`;
      $("question").textContent = card.question;
      (card.images || []).forEach((src, imageIndex) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = `Изображение к вопросу ${imageIndex + 1}`;
        img.loading = "lazy";
        $("media").appendChild(img);
      });
      card.options.forEach((option, optionIndex) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.textContent = option;
        btn.onclick = () => choose(optionIndex);
        $("answers").appendChild(btn);
      });
    }
    function choose(optionIndex) {
      if (!order.length) return;
      const card = cards[order[index]];
      const buttons = [...document.querySelectorAll(".answer")];
      if (card.correct_index === null || card.correct_index === undefined) {
        buttons.forEach((button, i) => {
          if (i === optionIndex) button.classList.add("selected");
        });
        const p = progress[card.id] || { right: 0, wrong: 0, seen: false };
        p.seen = true;
        p.selected = optionIndex;
        progress[card.id] = p;

        $("feedback").className = "feedback";

      buttons.forEach((button, i) => {
        if (i === card.correct_index) button.classList.add("correct");

      });
      const p = progress[card.id] || { right: 0, wrong: 0, seen: false };
      p.seen = true;
      if (optionIndex === card.correct_index) {

      } else {

      progress[card.id] = p;

      title.textContent = `Результат экзамена: ${result.correct} / ${examQuestionCount} (${result.correct}%)`;
      const details = document.createElement("span");
      details.textContent = `Ошибок: ${result.incorrect} · Без ответа: ${result.unanswered} · Время: ${examFormatDuration(result.elapsedMs)}${result.timedOut ? " · Время истекло" : ""}`;
      panel.replaceChildren(title, details);
    }

    function examApplyControls() {
      const active = Boolean(examState?.active);
      $("startExam").hidden = active;
      $("examStatus").hidden = !active;
      ["search", "filter", "shuffle", "reset", "show"].forEach(id => {
        const control = document.getElementById(id);
        if (control) control.disabled = active;
      });
      examRenderResult();
      if (active) examTick();
    }

    function examTick() {
      if (!examState?.active) return;
      const remaining = examState.deadline - Date.now();
      if (remaining <= 0) { examFinish(true); return; }
      $("examTimer").textContent = examFormatDuration(remaining);
      $("examTimer").classList.toggle("warning", remaining <= 10 * 60 * 1000);
      $("examAnswered").textContent = `Отвечено ${examAnsweredCount()} / ${examQuestionCount}`;
    }

    function examStart() {
      const pool = examUsableIndexes();
      if (pool.length < examQuestionCount) {
        alert(`Недостаточно вопросов с отмеченным правильным ответом: ${pool.length}`);
        return;
      }
      shuffleArray(pool);
      const now = Date.now();
      examState = {
        active: true,
        order: pool.slice(0, examQuestionCount),
        answers: {},
        current: 0,
        startedAt: now,
        deadline: now + examDurationMs,
        result: null,
      };
      order = [...examState.order];
      examSetCurrent(0);
      examSave();
      examApplyControls();
      render();
      clearInterval(examTimerHandle);
      examTimerHandle = setInterval(examTick, 1000);
    }

    function examFinish(timedOut = false) {
      if (!examState?.active) return;
      if (!timedOut && !confirm("Завершить экзамен и показать результат?")) return;
      clearInterval(examTimerHandle);
      const answered = examAnsweredCount();
      let correct = 0;
      examState.order.forEach(cardIndex => {
        const card = cards[cardIndex];
        if (Number(examState.answers[card.id]) === card.correct_index) correct += 1;
      });
      const finishedAt = Date.now();
      examState = {
        active: false,
        result: {
          correct,
          incorrect: answered - correct,
          unanswered: examQuestionCount - answered,
          elapsedMs: Math.min(examDurationMs, finishedAt - examState.startedAt),
          timedOut,
          finishedAt,
        },
      };
      examSave();
      examApplyControls();
      rebuild();
      $("examResult").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    const examPracticeRender = render;
    render = function() {
      examPracticeRender();
      if (!examInitialized || !examState?.active || !order.length) return;
      const pointer = examGetCurrent();
      examState.current = pointer;
      examSave();
      const card = cards[order[pointer]];
      examPositionElement().textContent = `Экзамен · ${pointer + 1} / ${examQuestionCount}`;
      const selected = examState.answers[card.id];
      [...document.querySelectorAll(".answer")].forEach((button, optionIndex) => {
        button.classList.toggle("selected", Number(selected) === optionIndex);
      });
      $("feedback").textContent = selected === undefined ? "Выберите один ответ" : "Ответ сохранён";
      $("feedback").className = "feedback";
      examTick();
    };

    const examPracticeChoose = choose;
    choose = function(optionIndex) {
      if (!examState?.active) { examPracticeChoose(optionIndex); return; }
      const card = cards[order[examGetCurrent()]];
      examState.answers[card.id] = optionIndex;
      examSave();
      render();
    };

    const examPracticeShow = $("show").onclick;
    $("show").onclick = () => {
      if (examState?.active) return;
      examPracticeShow();
    };
    $("startExam").onclick = examStart;
    $("finishExam").onclick = () => examFinish(false);

    function examInit() {
      examRenderResult();
      if (!examState?.active) { examInitialized = true; examApplyControls(); return; }
      const validOrder = Array.isArray(examState.order) && examState.order.length === examQuestionCount;
      if (!validOrder) { examState = null; examInitialized = true; localStorage.removeItem(examStorageKey); examApplyControls(); return; }
      if (examState.deadline <= Date.now()) { examInitialized = true; examFinish(true); return; }
      order = [...examState.order];
      examSetCurrent(Math.min(examState.current || 0, examQuestionCount - 1));
      examInitialized = true;
      examApplyControls();
      render();
      clearInterval(examTimerHandle);
      examTimerHandle = setInterval(examTick, 1000);
    }

    rebuild();
    examInit();
  </script>
</body>
</html>
